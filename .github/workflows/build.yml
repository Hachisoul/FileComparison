name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: BulkCheck-windows
          path: |
            dist/BulkCheck-Setup-*.exe
            dist/BulkCheck-Portable-*.exe
          retention-days: 30

  cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test CLI on Windows PowerShell 5.1
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File cli\test\test-cli.ps1
      - name: Test CLI on PowerShell 7
        shell: pwsh
        run: ./cli/test/test-cli.ps1
      - name: Run through bulkcheck.cmd
        shell: cmd
        run: |
          call cli\bulkcheck.cmd cli\test\fixtures\A\same.txt cli\test\fixtures\B\same.txt
          if errorlevel 1 exit /b 1
          call cli\bulkcheck.cmd cli\test\fixtures\A cli\test\fixtures\B -MaxLines 5
          if not errorlevel 1 exit /b 1
          exit /b 0
